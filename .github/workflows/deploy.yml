name: deploy

# A merge to main deploys. Branch protection only lets a commit reach main through a PR whose ci.yml
# jobs passed, so this workflow does not rerun them. It lives outside ci.yml because
# `axioms ci-dry-run` replays every ci.yml job, and a replay must never deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in merge order. A running deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://small-tools.pm-lemeliner.workers.dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      # Refuses on placeholders, dry-runs, applies D1 migrations remotely, then wrangler deploy.
      - run: bunx axioms deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
